<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>保齡球比賽 魔法查詢站</title>
    <style>
/* Hark's design tokens and component styles. Each component's rules follow its @component comment. style-gates: data */

/* @component foundations */
/* Every component switches layout at one of three widths: 600px, below which a page takes a phone's
   spacing; 761px, from which two-up components (stats, checklists, pairs) sit side by side; and 900px,
   from which heads, steps, timelines, cards and the hero's callout take their desktop layout. Media
   queries cannot read custom properties, so each query writes one side of those widths, and
   TestKitStylesheetsShareThreeBreakpoints holds every kit file to them. */
:root {
  color-scheme: light dark;

  --text-primary: light-dark(#1d1d1f, #f5f5f7);         /* body text */
  --text-secondary: light-dark(#636366, #a1a1a6);       /* supporting grey text */
  --text-tertiary: light-dark(#1d1d1f4d, #f5f5f74d);    /* hollow dots, faint marks; never body text */
  --text-primary-on: light-dark(#f5f5f7, #1d1d1f);      /* text on --fill-primary */
  --text-secondary-on: light-dark(#aeaeb2, #5c5c60);    /* grey text on --fill-primary */
  --fill-primary: light-dark(#1d1d1f, #f5f5f7);         /* the strong fill: solid chips, the nav, the badge */
  --fill-primary-on: light-dark(#f5f5f7, #1d1d1f);      /* the page background */
  --fill-secondary: light-dark(#1d1d1f80, #f5f5f780);
  --fill-tertiary: light-dark(#e8e8ea, #2a2a2d);        /* the grey card, panel and row tint */
  --fill-segment: light-dark(#3a3a3c, #e2e2e4);         /* the nav's tab track */
  --fill-system-green: #00a665;                         /* status: done, ready */
  --fill-system-orange: #ff4d00;                        /* status: now, current */
  --fill-system-red: light-dark(#da2f35, #f1555b);      /* status: blocked, error */
  --transparent-primary: light-dark(#1d1d1f4d, #f5f5f74d);
  --stroke-primary: light-dark(#1d1d1f24, #f5f5f724);   /* strong hairline */
  --stroke-secondary: light-dark(#1d1d1f12, #f5f5f712); /* faint hairline between rows */
  --stroke-primary-on: light-dark(#f5f5f71a, #1d1d1f1a);
  --stroke-composer: light-dark(#f5f5f780, #1d1d1f80);  /* the callout's glass edge */
  --stroke-system-orange: #ff4d0026;
  --hover-wash: light-dark(#1d1d1f0d, #f5f5f70d);
  --hover-wash-primary-on: light-dark(#f9f9fa26, #1d1d1f14);

  /* The hero is light text over a dark photo in both themes. */
  --hero-surface: #161f39;
  --hero-text: #f5f5f7;
  --hero-text-muted: #f5f5f7cc;
  --hero-scrim-strong: rgb(22 31 57 / 0.78);
  --hero-scrim-soft: rgb(22 31 57 / 0.3);
  --hero-scrim-side: rgb(22 31 57 / 0.45);
  --hero-glass: rgb(22 31 57 / 0.42);
  --hero-glass-faint: rgb(22 31 57 / 0.35);
  --hero-glass-stroke: rgb(245 245 247 / 0.28);

  --mat-regular: light-dark(rgb(255 255 255 / 0.56), rgb(29 29 31 / 0.55));
  --mat-thin: light-dark(rgb(255 255 255 / 0.22), rgb(29 29 31 / 0.4));
  --mat-agent: light-dark(rgb(255 255 255 / 0.84), rgb(29 29 31 / 0.66));
  --mat-inverse: color-mix(in srgb, var(--fill-primary) 86%, transparent);  /* the nav: dark on light, light on dark */
  --hark-blur: blur(50px) saturate(1.6);
  --hark-shadow: 0 8px 40px #1d1d1f1f;

  --sans: "GT Standard", "GT Standard L", "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --lh: 1.3;                                            /* every text style is 130% */
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 600;
  --size-caption: 12px;                                 /* the smallest text allowed */
  --size-meta: 13px;
  --size-small: 14px;
  --size-body: 15px;
  --size-prose: 16px;
  --size-heading: 20px;
  --size-figure: clamp(24px, 3vw, 32px);
  --size-title: clamp(26px, 3vw, 32px);
  --size-display: clamp(34px, 5vw, 48px);
  --size-lede: clamp(16px, 1.7vw, 20px);

  --type-caption: var(--weight-regular) var(--size-caption)/var(--lh) var(--sans);
  --type-tag: var(--weight-medium) var(--size-caption)/var(--lh) var(--sans);
  --type-small: var(--weight-regular) var(--size-small)/var(--lh) var(--sans);
  --type-label: var(--weight-medium) var(--size-small)/var(--lh) var(--sans);
  --type-body: var(--weight-regular) var(--size-body)/var(--lh) var(--sans);
  --type-body-strong: var(--weight-medium) var(--size-body)/var(--lh) var(--sans);
  --type-heading: var(--weight-medium) var(--size-heading)/var(--lh) var(--sans);
  --type-lede: var(--weight-medium) var(--size-lede)/var(--lh) var(--sans);
  --type-figure: var(--weight-regular) var(--size-figure)/var(--lh) var(--sans);
  --type-title: var(--weight-regular) var(--size-title)/var(--lh) var(--sans);
  --type-display: var(--weight-medium) var(--size-display)/var(--lh) var(--sans);
  --type-numeral: var(--weight-regular) 48px/1 var(--sans);

  --r-s: 12px;
  --r-m: 16px;
  --r-l: 24px;
  --r-xl: 32px;
  --r-pill: 100px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-quick: 160ms;

  --page-max: 1120px;
  --gutter: clamp(16px, 3vw, 32px);                     /* the page's side padding */
  --tap: 44px;                                          /* the smallest touch target */
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
/* The page keeps its own bounce but never hands a fling on: a page is framed in Hark's /site
   page, and a fling past its top would otherwise carry on into that page and drag the frame down. */
html, body { overscroll-behavior-y: contain; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* The page background lives on body and html stays transparent, so the browser paints the whole
   canvas, and the band a bounce reveals, in body's color, including a page's own override of it. */
body {
  margin: 0;
  background: var(--fill-primary-on);
  color: var(--text-primary);
  font: var(--type-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
figure { margin-inline: 0; }
a { color: inherit; }
b, strong { font-weight: var(--weight-bold); }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
small { font-size: max(var(--size-caption), 0.85em); }
.sub { color: var(--text-secondary); }

:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 3px; border-radius: 6px; }

/* @component page */
.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 12px 40px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.glass {
  background: var(--mat-inverse);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-primary-on);
}
.nav {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  z-index: 20;
  justify-self: center;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border-radius: var(--r-pill);
  box-shadow: var(--hark-shadow);
}
.nav :focus-visible { outline-color: var(--fill-primary-on); }
.seg {
  display: flex;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: var(--r-pill);
  background: var(--fill-segment);
}
.seg::-webkit-scrollbar { display: none; }
.seg a {
  flex: none;
  padding: 8px 14px;
  border-radius: var(--r-pill);
  font: var(--type-label);
  color: var(--text-secondary-on);
  text-decoration: none;
  white-space: nowrap;
}
.seg a:hover { color: var(--text-primary-on); }
/* The active tab carries its own fill so its text is measured against it. */
.seg a[aria-current="true"] { background: var(--fill-primary-on); color: var(--text-primary); }
.theme-btn {
  flex: none;
  width: 36px; height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--hover-wash-primary-on);
  color: var(--text-primary-on);
  cursor: pointer;
}
.theme-btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.theme-btn::before { content: ""; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; background: linear-gradient(to right, light-dark(currentColor, transparent) 50%, light-dark(transparent, currentColor) 50%); }
@media (max-width: 599px) {
  .seg a { display: flex; align-items: center; min-height: var(--tap); }
  .theme-btn { width: var(--tap); height: var(--tap); }
}

/* @component footer */
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
  padding-top: 24px;
  border-top: 1px solid var(--stroke-secondary);
  font-size: var(--size-small);
  color: var(--text-secondary);
}
.foot strong { color: var(--text-primary); }
.foot nav { display: flex; flex-wrap: wrap; gap: 6px; }
.foot nav a {
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-primary);
  font: var(--type-tag);
  text-decoration: none;
}
.foot nav a:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--r-xl);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  box-shadow: var(--hark-shadow);
  font: var(--weight-medium) var(--size-body)/1.1 var(--sans);
  text-decoration: none;
}
.badge:hover { box-shadow: var(--hark-shadow), inset 0 0 0 100px var(--hover-wash-primary-on); }
.hark-mark { display: inline-grid; place-items: center; }
.hark-mark svg { display: block; }
@media (max-width: 599px) {
  .foot nav a { display: inline-flex; align-items: center; min-height: var(--tap); min-width: var(--tap); }
  .badge { min-height: var(--tap); }
}

/* @component chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  border-radius: var(--r-pill);
  font: var(--type-tag);
  max-width: 100%;
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  vertical-align: middle;
}
.chip::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  flex: none;
  box-shadow: inset 0 0 0 1.5px var(--text-tertiary);
}
.chip--solid { background: var(--fill-primary); color: var(--text-primary-on); }
.chip--solid::before { background: var(--fill-system-green); box-shadow: none; }
td .chip { white-space: nowrap; }
/* @component dot */
.dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font: var(--type-tag);
  color: var(--text-primary);
}
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fill-system-green); }
tbody th .dot { display: flex; width: fit-content; }
/* @component pill */
.pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  font: var(--type-tag);
  white-space: normal;
  vertical-align: 1px;
}
/* @component button, link and links */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 5px 12px;
  border-radius: var(--r-s);
  background: var(--fill-primary-on);
  color: var(--text-primary);
  border: 1px solid var(--stroke-primary);
  font: var(--type-tag);
  text-decoration: none;
  max-width: 100%;
  transition: box-shadow var(--dur-quick) ease;
}
.btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.btn[target="_blank"]::after { content: "\2197"; font-size: 11px; color: var(--text-secondary); }
.link {
  color: var(--text-primary);
  text-decoration: underline;
  text-decoration-color: var(--stroke-primary);
  text-underline-offset: 3px;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.link:hover { text-decoration-color: currentColor; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
@media (pointer: coarse), (max-width: 599px) { .btn { min-height: var(--tap); padding-inline: 14px; } }

/* A button that asks Hark is the page's primary capsule. Once it sends, Hark
   writes a check and "Sent to Hark" into it, and it turns secondary. A press
   that does not send shows a short notice in place of its words for a moment. */
.btn[data-hark-action] {
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  font: var(--type-body-strong);
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  transition: box-shadow var(--dur-quick) ease, transform var(--dur-quick) ease;
}
.btn[data-hark-action]:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.btn[data-hark-action]:active { transform: scale(0.97); }
.btn[data-hark-action] svg { flex: none; }
.btn[data-hark-action][data-hark-state="sent"] { background: var(--fill-tertiary); color: var(--text-primary); box-shadow: none; }

[data-hark-action][data-hark-state="sending"] { opacity: 0.6; pointer-events: none; }
[data-hark-action][data-hark-state="sent"] { pointer-events: none; cursor: default; }
@media (max-width: 599px) {
  .link { display: inline-flex; align-items: center; min-width: var(--tap); min-height: var(--tap); margin: -13px 0; vertical-align: middle; }
}
/* @component text and fineprint */
.prose { display: grid; gap: 12px; max-width: 68ch; font-size: var(--size-prose); }
.fineprint { font-size: var(--size-small); color: var(--text-secondary); max-width: 70ch; }
/* @component hero */
.hero {
  position: relative;
  min-height: clamp(320px, 46vh, 480px);
  border-radius: var(--r-xl);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  color: var(--hero-text);
  isolation: isolate;
  box-shadow: var(--hark-shadow);
  background: var(--hero-surface);
}
/* Without a photo the hero is as tall as its copy, so the callout sits beside the copy instead of over it. */
.hero:not(:has(.hero__img)) { min-height: 0; background: var(--hero-surface) center / cover no-repeat; }
.hero:not(:has(.hero__img))::after { background: linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%); }
@media (min-width: 900px) {
  .hero:not(:has(.hero__img)) > .callout { position: static; flex: none; align-self: flex-start; margin: clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) auto; }
}
.hero__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 40% 60%;
  z-index: -2;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to top, var(--hero-scrim-strong) 0%, var(--hero-scrim-soft) 42%, transparent 66%),
    linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%);
}
.hero__copy {
  display: grid;
  gap: 14px;
  max-width: 40rem;
  padding: clamp(24px, 4vw, 48px);
  padding-bottom: clamp(28px, 3.4vw, 44px);
}
.hero__eyebrow {
  justify-self: start;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--hero-glass);
  border: 1px solid var(--hero-glass-stroke);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-label);
}
.hero h1 { font: var(--type-display); letter-spacing: 0; }
.hero h1 em { font-style: normal; }
.hero__sub { font: var(--type-lede); max-width: 34ch; }
.hero__meta { font-size: var(--size-small); color: var(--hero-text-muted); }
.hero__credit {
  position: absolute;
  right: clamp(20px, 3vw, 32px);
  bottom: 16px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--hero-glass-faint);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-caption);
  color: var(--hero-text-muted);
}
/* A callout overlays the photo's top corner, so the hero keeps room for it above the copy. */
@media (min-width: 900px) { .hero:has(> .callout) { min-height: clamp(420px, 56vh, 560px); } }
.hero > .callout {
  position: absolute;
  top: clamp(16px, 2.4vw, 24px);
  right: clamp(16px, 2.4vw, 24px);
  width: min(320px, calc(100% - 32px));
}
@media (max-width: 899px) {
  .hero { flex-direction: column; justify-content: flex-end; align-items: stretch; min-height: 0; }
  .hero__img { object-position: 22% 50%; }
  .hero__copy { padding-top: 140px; padding-bottom: 28px; }
  .hero:not(:has(.hero__img)) .hero__copy { padding-top: clamp(24px, 4vw, 48px); }
  .hero__credit { top: 16px; right: 16px; bottom: auto; }
  .hero > .callout { position: static; width: auto; margin: 0 12px 12px; }
}
/* On a phone the title starts higher, so the first screen reaches the stats. */
@media (max-width: 599px) { .hero__copy { padding-top: 88px; padding-bottom: 20px; } }
/* @component callout */
.callout {
  max-width: 420px;
  display: grid;
  gap: 10px;
  padding: 16px 18px 18px;
  border-radius: var(--r-l);
  background: var(--mat-agent);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-composer);
  box-shadow: var(--hark-shadow);
  color: var(--text-primary);
  font-size: var(--size-small);
}
.callout__head { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-weight: var(--weight-medium); }
.callout__head svg { color: var(--text-primary); }
.callout__lead { font-size: var(--size-body); }
.callout .fineprint { font-size: var(--size-caption); }
.callout .btn { justify-self: start; }
/* @component stats */
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding-top: 8px; }
.stat {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 4px;
  padding: 12px 24px;
  border-left: 1px solid var(--stroke-secondary);
}
.stat:first-child { border-left: 0; padding-left: 0; }
.stat__fig { font: var(--type-figure); font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--size-small); color: var(--text-secondary); }
@media (max-width: 760px) {
  .stats { grid-auto-flow: row; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; padding-top: 0; }
  .stat { grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; gap: 12px; padding: 14px 0; border-left: 0; border-top: 1px solid var(--stroke-secondary); }
  .stat:first-child { border-top: 0; }
}
/* On a phone the stats sit two to a row, figure over label. */
@media (max-width: 599px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0; }
  .stat { grid-column: auto; grid-template-columns: none; gap: 2px; padding: 12px 0; }
  .stat:nth-child(2) { border-top: 0; }
  .stat:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--stroke-secondary); }
  .stat__fig { font-size: 26px; line-height: 1.15; }
  .stat__label { font-size: var(--size-caption); }
}
/* @component section */
.section {
  padding-block: clamp(40px, 6vw, 72px) clamp(16px, 2vw, 24px);
  border-top: 1px solid var(--stroke-secondary);
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); /* Clears the sticky .nav: its top offset plus its tallest height, 56px. */
  min-width: 0;
}
.section > * + * { margin-top: clamp(20px, 2.4vw, 28px); }
.section > .head + * { margin-top: 0; }
.head {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 10px 40px;
  align-items: end;
  margin-bottom: clamp(24px, 3vw, 36px);
}
.head__eyebrow { grid-column: 1 / -1; font: var(--type-label); color: var(--text-secondary); }
.head h2 { font: var(--type-title); }
.head__sub { justify-self: end; font-size: var(--size-body); color: var(--text-secondary); max-width: 44ch; text-align: right; }
@media (max-width: 899px) { .head { grid-template-columns: 1fr; } .head__sub { justify-self: start; text-align: left; } }
/* @component table */
.table-wrap { margin-inline: -12px; padding-inline: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font: var(--type-small); font-variant-numeric: tabular-nums; }
caption { text-align: left; font: var(--type-caption); color: var(--text-secondary); padding: 0 0 10px; }
th, td { text-align: left; vertical-align: top; padding: 12px; border-bottom: 1px solid var(--stroke-secondary); }
th:first-child, td:first-child { padding-left: 0; }

    <script>
/* Page behaviors for Hark's component library: the nav, the theme toggle, tables and images. style-gates: data */
(function () {
  "use strict";
  var doc = document, root = doc.documentElement;
  root.classList.add("js");
  var LOGO = '<svg width="SIZE" height="SIZE" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path fill="currentColor" d="M25.096 30c-.072 0-.12-.048-.168-.12-4.776-6.384-12.216-10.8-20.736-11.688C4.048 18.168 4 18.096 4 18s.048-.168.192-.192c8.52-.888 15.96-5.304 20.736-11.688.048-.072.096-.12.168-.12s.096.024.168.072A15.02 15.02 0 0 1 31.12 18a15.02 15.02 0 0 1-5.856 11.928c-.072.048-.096.072-.168.072"/></svg>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function each(a, f) { return (a || []).map(f).join(""); }
  function navLink(s) { return '<a href="#' + esc(s.id) + '" data-for="' + esc(s.id) + '">' + esc(s.getAttribute("data-nav")) + "</a>"; }
  // A section the page hides (an owner-only one, until the app says who is reading) drops out of
  // the nav, and comes back when the page shows it. The link's own display is set, since .seg a sets one.
  function syncNav() {
    [].slice.call(doc.querySelectorAll("a[data-for]")).forEach(function (a) {
      var s = doc.getElementById(a.getAttribute("data-for"));
      a.style.display = s && s.closest("[hidden]") ? "none" : "";
    });
  }
  function autoNav() {
    var sections = [].slice.call(doc.querySelectorAll("section[data-nav]"));
    var header = doc.querySelector("header.nav[data-auto]");
    if (header) {
      header.innerHTML = '<nav class="seg" aria-label="Sections">' + each(sections, navLink) + "</nav>" +
        '<button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to dark theme"></button>';
    }
    [].slice.call(doc.querySelectorAll(".foot nav[data-auto]")).forEach(function (n) {
      n.innerHTML = '<a href="#top">Top</a>' + each(sections, navLink);
    });
    syncNav();
    if (sections.length && window.MutationObserver) {
      new MutationObserver(syncNav).observe(doc.body, { attributes: true, attributeFilter: ["hidden"], subtree: true });
    }
    [].slice.call(doc.querySelectorAll(".table-wrap table")).forEach(function (t) {
      var names = [].map.call(t.querySelectorAll("thead th"), function (th) { return th.textContent.trim(); });
      [].slice.call(t.querySelectorAll("tbody tr")).forEach(function (tr) {
        [].slice.call(tr.children).forEach(function (c, i) {
          if (c.tagName !== "TD") return;
          if (!c.textContent.trim() && !c.querySelector("img, svg")) c.classList.add("is-empty");
          else if (names[i] && !c.hasAttribute("data-label")) c.setAttribute("data-label", names[i]);
        });
      });
    });
    [].slice.call(doc.querySelectorAll(".compare table")).forEach(function (t) {
      t.parentNode.style.setProperty("--compare-cols", t.querySelectorAll("thead th").length);
      [].slice.call(t.querySelectorAll(".compare__media .chip")).forEach(function (chip) {
        chip.closest("th").appendChild(chip);
      });
      [].slice.call(t.querySelectorAll("tbody tr")).forEach(function (tr) {
        var head = tr.querySelector("th"), label = head ? head.textContent.trim() : "";
        [].slice.call(tr.querySelectorAll("td")).forEach(function (td) {
          if (label && !td.hasAttribute("data-label")) td.setAttribute("data-label", label);
        });
      });
    });
    [].slice.call(doc.querySelectorAll(".step__figure img, .band img")).forEach(function (im) {
      var mark = function () { if (im.naturalHeight > im.naturalWidth) im.parentNode.classList.add("is-portrait"); };
      if (im.complete) mark(); else im.addEventListener("load", mark);
    });
    [].slice.call(doc.querySelectorAll(".hark-mark:empty")).forEach(function (m) { m.innerHTML = LOGO.replace(/SIZE/g, m.getAttribute("data-size") || "20"); });
  }

  // Gives each day of plans a toggle and opens the first day. hark-trip.css shows the toggle, and
  // closes the other days, only on a phone.
  function dayToggles() {
    [].slice.call(doc.querySelectorAll(".timeline > li")).forEach(function (day, i) {
      var what = day.querySelector(".timeline__what");
      if (!what || !what.querySelector(".plan") || what.querySelector(".day__toggle")) return;
      var btn = doc.createElement("button");
      btn.type = "button";
      btn.className = "day__toggle";
      var label = function () {
        var open = day.classList.contains("is-open");
        btn.textContent = open ? "Hide details" : "Show details";
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      };
      if (i === 0) day.classList.add("is-open");
      btn.addEventListener("click", function () { day.classList.toggle("is-open"); label(); });
      label();
      what.appendChild(btn);
    });
  }

  function behaviors() {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var btn = doc.getElementById("theme-btn"), mq = window.matchMedia("(prefers-color-scheme: dark)");
    try { var saved = localStorage.getItem("hark-theme"); if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved); } catch (e) { /* storage blocked: follow the system theme */ }
    function current() { var t = root.getAttribute("data-theme"); return t === "light" || t === "dark" ? t : (mq.matches ? "dark" : "light"); }
    function label() { if (btn) btn.setAttribute("aria-label", current() === "dark" ? "Switch to light theme" : "Switch to dark theme"); }
    if (btn) btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("hark-theme", next); } catch (e) { /* storage blocked: the choice lasts this visit */ }
      label();
    });
    label();

    var seg = doc.querySelector(".seg");
    if (seg) {
      var links = [].slice.call(seg.querySelectorAll("a"));
      var targets = links.map(function (a) { return doc.getElementById(a.getAttribute("href").slice(1)); });
      var active = -2;
      var reveal = function (i) {
        if (i < 0) return;
        var a = links[i];
        var l = a.offsetLeft - 8, r = a.offsetLeft + a.offsetWidth + 8;
        if (l < seg.scrollLeft || r > seg.scrollLeft + seg.clientWidth) seg.scrollTo({ left: l, behavior: reduce ? "auto" : "smooth" });
      };
      var sync = function (force) {
        var line = window.innerHeight * 0.32, cur = -1;
        targets.forEach(function (t, i) { if (t && !t.closest("[hidden]") && t.getBoundingClientRect().top <= line) cur = i; });
        if (cur === active && !force) return;
        active = cur;
        links.forEach(function (a, i) { if (i === cur) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });

      };

      window.addEventListener("scroll", function () {
        if (ticking) return; ticking = true;
        window.requestAnimationFrame(function () { sync(false); ticking = false; });
      }, { passive: true });
      window.addEventListener("resize", function () { sync(true); }, { passive: true });
      if (window.MutationObserver) new MutationObserver(function () { sync(true); }).observe(doc.body, { attributes: true, attributeFilter: ["hidden"], subtree: true });
      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { sync(true); });
      sync(true);
    }

  }

  function start() {
    autoNav();
    dayToggles();
    behaviors();
  }
  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", start);
  else start();

</script>
    <script>
      (function () {
        var players = [];
        try { players = JSON.parse(document.getElementById("players").textContent || "[]"); } catch (e) { players = []; }
        var FATE = {
          "牡羊座": ["♈", "衝第一個丟球的一定是你！熱血是好事，但記得先站穩再出手，別讓球比你先暴衝出去～"],
          "金牛座": ["♉", "穩如泰山、慢工出細活，每一球都要瞄個三秒。隊友等得有點餓，但你的分數值得等！"],
          "雙子座": ["♊", "丟球前還在跟隔壁道聊天？小心聊著聊著就全倒…或是洗溝，一切看心情！"],
          "巨蟹座": ["♋", "全場最會幫隊友加油的就是你，自己全倒反而害羞說「運氣啦～」。今天記得也幫自己歡呼！"],
          "獅子座": ["♌", "全倒之後的帥氣轉身已經練好了吧？鎂光燈都在你身上，記得擺個 pose 給攝影組！"],
          "處女座": ["♍", "球道油膩度、助走步數、手指角度都計算好了…放輕鬆，球瓶不會跟你吵架的啦！"],
          "天秤座": ["♎", "選球選了十分鐘還在猶豫 12 磅還是 13 磅？閉上眼睛隨便抓一顆，就是命中注定那顆！"],
          "天蠍座": ["♏", "表面淡定，心裡默默在算對手分數，對吧？你的眼神殺氣已經先擊倒三支瓶了！"],
          "射手座": ["♐", "出手又快又直，自信爆棚！只是偶爾直到隔壁球道去，請先跟鄰居打聲招呼～"],
          "摩羯座": ["♑", "認真程度堪比年度業績檢討，連補中都要有 SOP。今天准你笑一個，分數會更好看！"],
          "水瓶座": ["♒", "獨門怪招丟法讓全場看傻眼，而且竟然還會進！創意保齡球冠軍非你莫屬。"],
          "雙魚座": ["♓", "浪漫派選手，丟出去的球都帶著夢幻弧線…能不能倒全憑宇宙安排，但姿勢一定最美！"]
        };
        var MYSTERY = "連水晶球都算不出你的星座，神秘感直接拉滿！今天就靠實力說話，讓球瓶自己猜吧～";

        var $ = function (id) { return document.getElementById(id); };
        var form = $("form"), qB = $("qBranch"), qN = $("qName"), msg = $("msg"), out = $("results");

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function norm(s) { return String(s || "").replace(/\s+/g, "").replace(/台/g, "臺"); }
        function normBranch(s) { return norm(s).replace(/(獅子會|分會)$/g, "").replace(/(獅子會|分會)/g, ""); }

        // datalist
        var branches = Array.from(new Set(players.map(function (p) { return p.branch; }))).sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
        $("branches").innerHTML = branches.map(function (b) { return '<option value="' + esc(b) + '"></option>'; }).join("");

        // lane index
        var byLane = {};
        players.forEach(function (p) { (byLane[p.lane] = byLane[p.lane] || []).push(p); });

        function showMsg(t) { msg.textContent = t; msg.hidden = false; msg.style.animation = "none"; void msg.offsetWidth; msg.style.animation = ""; }

        function card(p, i) {
          var z = p.zodiac && FATE[p.zodiac];
          var fate = z
            ? "<strong>" + z[0] + " " + esc(p.zodiac) + "魔法預言：</strong>" + z[1]
            : "<strong>🔮 神秘星座魔法預言：</strong>" + MYSTERY;
          var mates = (byLane[p.lane] || []).filter(function (m) { return m !== p; });
          var mateHtml = mates.length
            ? "<ul>" + mates.map(function (m) { return "<li>" + esc(m.name) + "<small>" + esc(m.branch) + "</small></li>"; }).join("") + "</ul>"
            : '<ul><li>這條球道目前只有你，獨享整條魔法球道！</li></ul>';
          return '<article class="x-card" style="animation-delay:' + Math.min(i, 12) * 0.05 + 's">' +
            '<h2 class="x-name">' + esc(p.name) + "</h2>" +
            '<span class="x-branch">' + esc(p.branch) + " 分會</span>" +
            '<div class="x-lane"><span>🎳 球道號碼</span><b>' + esc(p.lane) + "</b></div>" +
            '<dl class="x-facts">' +
            "<div><dt>👕 衣服尺寸</dt><dd" + (p.size ? ">" + esc(p.size) : ' class="x-tbd">待確認') + "</dd></div>" +
            "<div><dt>🏆 組別</dt><dd>" + esc(p.group) + "</dd></div>" +
            "<div><dt>🍽️ 桌號</dt><dd" + (p.table != null && p.table !== "" ? ">" + esc(p.table) : ' class="x-tbd">待公布') + "</dd></div>" +
            "</dl>" +
            '<p class="x-fate">' + fate + "</p>" +
            '<details class="x-mates"><summary>看看同球道的隊友（' + mates.length + " 位）</summary>" + mateHtml + "</details>" +
            "</article>";
        }

        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function burst(el) {
          if (reduce) return;
          var b = document.createElement("div");
          b.className = "x-burst";
          var chars = ["✨", "⭐", "💖", "✦", "🌟", "✧"];
          for (var k = 0; k < 16; k++) {
            var s = document.createElement("i");
            var ang = (Math.PI * 2 * k) / 16, r = 90 + Math.random() * 70;
            s.textContent = chars[k % chars.length];
            s.style.setProperty("--dx", Math.cos(ang) * r + "px");
            s.style.setProperty("--dy", Math.sin(ang) * r + "px");
            b.appendChild(s);
          }
          el.appendChild(b);
          setTimeout(function () { b.remove(); }, 1300);
        }

        function search() {
          var b = normBranch(qB.value), n = norm(qN.value);
          out.innerHTML = "";
          if (!b && !n) { showMsg("至少給水晶球一點線索嘛～分會或姓名擇一就好！"); return; }
          var hits = players.filter(function (p) {
            return (!b || normBranch(p.branch).indexOf(b) !== -1) && (!n || norm(p.name).indexOf(n) !== -1);
          });
          hits.sort(function (x, y) { return x.lane - y.lane || x.branch.localeCompare(y.branch, "zh-Hant"); });
          if (!hits.length) { showMsg("咦？水晶球霧茫茫…找不到這位選手，檢查一下字有沒有打錯？"); return; }
          msg.hidden = true;
          var cls = hits.length === 1 ? "x-grid x-one" : hits.length > 4 ? "x-grid x-many" : "x-grid";
          out.innerHTML = '<p class="x-count">🔮 水晶球找到 ' + hits.length + " 位選手</p>" +
            '<div class="' + cls + '">' + hits.map(card).join("") + "</div>";
          if (hits.length === 1) burst(out.querySelector(".x-card"));
          out.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
        }

        form.addEventListener("submit", function (e) { e.preventDefault(); search(); });
        [qB, qN].forEach(function (inp) {
          inp.addEventListener("keydown", function (e) {
            if ((e.key === "Enter" || e.keyCode === 13) && !e.isComposing) { e.preventDefault(); search(); }
          });
        });
        $("clear").addEventListener("click", function () { qB.value = ""; qN.value = ""; out.innerHTML = ""; msg.hidden = true; qB.focus(); });

        // floating sparkles
        if (!reduce) {
          var sky = $("sky"), glyphs = ["✦", "✧", "⋆", "✨", "·"];
          var count = window.innerWidth < 600 ? 14 : 24;
          for (var i = 0; i < count; i++) {
            var s = document.createElement("span");
            s.className = "x-spark";
            s.setAttribute("data-g", glyphs[i % glyphs.length]);
            s.style.left = Math.random() * 100 + "%";
            s.style.top = 10 + Math.random() * 90 + "%";
            s.style.fontSize = 14 + Math.random() * 14 + "px";
            s.style.animationDuration = 6 + Math.random() * 8 + "s";
            s.style.animationDelay = -Math.random() * 10 + "s";
            sky.appendChild(s);
          }
        }
      })();
    </script>
  </body>
</html>
